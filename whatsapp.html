<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compras WhatsApp · AgroDávila</title><meta name="theme-color" content="#2B4C6F"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="iconos/icono-192.png"><link rel="apple-touch-icon" href="iconos/icono-192.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="comun.js"></script><script src="guia.js"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6F3;--card:#FFFFFF;--tx:#1D2A22;--t2:#5E6B63;--bd:#DDE3DE;--ok:#2E7D4F;--okbg:#E5F3EA;--md:#B7791F;--mdbg:#FDF3DC;--al:#C2591B;--albg:#FCE9DC;--cr:#B42318;--crbg:#FBE4E2;--pri:#1F5E3B;--pri2:#E3EFE7;--az:#0F4C81;--azbg:#E4EEF8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1B231F;--tx:#E6ECE8;--t2:#9AA9A0;--bd:#2C3832;--ok:#6CC08E;--okbg:#1E3A2A;--md:#E2B25A;--mdbg:#3A2F17;--al:#EE9A63;--albg:#3D2618;--cr:#F0857A;--crbg:#43201D;--pri:#5FB386;--pri2:#21342A;--az:#7FB2E5;--azbg:#1A2A3A}}
:root[data-theme="dark"]{--bg:#121815;--card:#1B231F;--tx:#E6ECE8;--t2:#9AA9A0;--bd:#2C3832;--ok:#6CC08E;--okbg:#1E3A2A;--md:#E2B25A;--mdbg:#3A2F17;--al:#EE9A63;--albg:#3D2618;--cr:#F0857A;--crbg:#43201D;--pri:#5FB386;--pri2:#21342A;--az:#7FB2E5;--azbg:#1A2A3A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--pri);color:#fff;padding:14px 16px 0}
:root[data-theme="dark"] header{color:#0d1511}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header{color:#0d1511}}
header h1{margin:0;font-size:19px}
header .sub{opacity:.85;font-size:13px;margin:2px 0 10px}
.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.top .acc{display:flex;gap:6px;flex-wrap:wrap}
nav{display:flex;gap:2px;overflow-x:auto;margin:0 -16px;padding:0 12px}
nav button{background:transparent;border:0;color:inherit;opacity:.8;padding:10px 12px;font:inherit;font-size:14px;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent}
nav button[aria-selected="true"]{opacity:1;border-bottom-color:currentColor;font-weight:600}
main{max-width:1200px;margin:0 auto;padding:16px}
.banner{background:var(--mdbg);color:var(--md);padding:8px 16px;font-size:14px}
.btn{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer;min-height:36px}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
:root[data-theme="dark"] .btn.pri{color:#0d1511}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#0d1511}}
.btn.sm{padding:4px 9px;min-height:30px;font-size:13px}
header .btn{background:rgba(255,255,255,.14);color:inherit;border-color:rgba(255,255,255,.35)}
:focus-visible{outline:3px solid var(--az);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}
.kpi .v{font-size:26px;font-weight:700;line-height:1.1}
.kpi .l{color:var(--t2);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 10px}
.card h3{font-size:15px;margin:14px 0 6px}
.muted{color:var(--t2)}
.small{font-size:13px}
.filtros{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
input,select,textarea{font:inherit;font-size:14px;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 9px;min-height:36px;max-width:100%}
textarea{width:100%;min-height:150px}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
th{background:var(--pri2);font-weight:600;white-space:nowrap;position:sticky;top:0;cursor:pointer;user-select:none}
th.nosort{cursor:default}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.kpi .l .chip{white-space:normal}
.kpi{min-width:0}
.c-ok{background:var(--okbg);color:var(--ok)}.c-md{background:var(--mdbg);color:var(--md)}.c-al{background:var(--albg);color:var(--al)}.c-cr{background:var(--crbg);color:var(--cr)}.c-az{background:var(--azbg);color:var(--az)}.c-gr{background:var(--pri2);color:var(--t2)}
.clase{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-weight:700;font-size:13px}
.lnk{background:none;border:0;color:var(--az);font:inherit;cursor:pointer;padding:0;text-align:left;text-decoration:underline;text-underline-offset:2px}
.tarea{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--bd)}
.tarea:last-child{border-bottom:0}
.tarea .q{font-weight:600}
.barra{height:12px;border-radius:6px;background:var(--pri)}
.rk{display:grid;grid-template-columns:minmax(120px,220px) 1fr 70px;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.kq{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kq>div{border:1px solid var(--bd);border-radius:10px;padding:10px;min-height:120px}
.kq h4{margin:0 0 4px;font-size:14px}
.kq p{margin:0 0 6px;font-size:13px;color:var(--t2)}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);max-width:760px;width:calc(100% - 24px);padding:0}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--card)}
.dlg-h h2{margin:0;font-size:17px}
.dlg-b{padding:14px 16px;max-height:75vh;overflow:auto}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 16px}
.campo label{display:block;font-size:13px;color:var(--t2);margin-bottom:2px}
.campo input,.campo select{width:100%}
.ev{font-style:italic;color:var(--t2);font-size:13px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.hidden{display:none!important}
@media (max-width:600px){main{padding:12px}.kq{grid-template-columns:1fr}.rk{grid-template-columns:110px 1fr 56px}.tarea{grid-template-columns:1fr}.kpi .v{font-size:22px}}
@media print{header nav,.top .acc,.filtros,.btn{display:none!important}body{background:#fff}}
</style>

<body>
<header>
  <div class="top">
    <div><h1>Compras por WhatsApp · AgroDávila</h1><div class="sub" id="sub">Cargando…</div></div>
    <div class="acc"><a class="btn sm ir-inicio" href="index.html">← Inicio</a>
      <button class="btn sm hidden" id="bImp" type="button" aria-hidden="true" tabindex="-1">Importar datos</button>
      <button class="btn sm hidden" id="bExp" type="button" aria-hidden="true" tabindex="-1">Exportar todo (JSON)</button>
      <button class="btn sm" id="bTema" type="button" aria-label="Cambiar tema claro u oscuro">Tema</button>
      <input type="file" id="fImp" accept=".json,.js" class="hidden">
    </div>
  </div>
  <nav role="tablist" id="nav"></nav>
</header>
<div class="banner hidden" id="bannerEj">Estás viendo <b>datos de ejemplo</b>. Coloca <code>datos_compras.js</code> en esta carpeta o usa «Importar datos».</div>
<main id="main"></main>
<dialog id="dlg"><div class="dlg-h"><h2 id="dlgT"></h2><button class="btn sm" type="button" id="dlgX" aria-label="Cerrar">✕</button></div><div class="dlg-b" id="dlgB"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>


<script>
"use strict";
/* ====== Utilidades ====== */
const LS="compras_wa_v1", LSA="compras_wa_ajustes_v1";
const $=s=>document.querySelector(s);
const esc=v=>v==null?"":String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const raya="—";
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const usd=n=>n==null||isNaN(n)?raya:Number(n).toLocaleString("es-EC",{style:"currency",currency:"USD"});
const pct=n=>n==null||isNaN(n)?raya:Math.round(n*100)+" %";
function dur(min){if(min==null||isNaN(min))return raya;if(min<60)return Math.round(min)+" min";if(min<1440)return (min/60).toFixed(min<600?1:0).replace(".",",")+" h";return (min/1440).toFixed(1).replace(".",",")+" d";}
function fecha(s){if(!s)return raya;const d=new Date(String(s).length<=10?s+"T12:00:00":s);return isNaN(d)?esc(s):d.toLocaleDateString("es-EC",{day:"2-digit",month:"short",year:"numeric"});}
function dias(desde,hasta){if(!desde)return null;const a=new Date(String(desde).slice(0,10)+"T12:00:00"),b=new Date(String(hasta).slice(0,10)+"T12:00:00");if(isNaN(a)||isNaN(b))return null;return Math.round((b-a)/864e5);}
function lsGet(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove("on"),1800);}
function copiar(t){const ok=()=>toast("Copiado. Pégalo en WhatsApp.");if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(ok,()=>copiarViejo(t,ok));}else copiarViejo(t,ok);}
function copiarViejo(t,ok){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok();}catch(e){toast("No se pudo copiar");}a.remove();}
function descargar(nombre,contenido,tipo){const b=new Blob([contenido],{type:tipo});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=nombre;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function csv(nombre,cab,filas){const q=v=>{v=v==null?"":String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};descargar(nombre,"﻿"+[cab,...filas].map(f=>f.map(q).join(";")).join("\r\n"),"text/csv;charset=utf-8");}

/* ====== Estado y datos ====== */
const ESTADOS={por_cotizar:["Por cotizar","c-cr"],cotizacion_pedida:["Cotización pedida","c-az"],cotizado:["Cotizado","c-az"],aprobado:["Aprobado","c-md"],orden:["Orden enviada","c-md"],en_transito:["En tránsito","c-al"],recibido:["Recibido","c-ok"],facturado:["Facturado","c-ok"],pagado:["Pagado","c-gr"],sin_stock:["Sin stock","c-cr"],cancelado:["Cancelado","c-gr"]};
ESTADOS.cerrado=["Cerrado (entregado y facturado)","c-gr"];
const CERRADOS=new Set(["cerrado","cancelado"]);
const AJ_DEF={pesos:{rapidez:30,respuesta:20,precio:25,disponibilidad:10,cumplimiento:15},diasCot:2,diasPed:7,tema:"",fechaHoy:false};
let BASE=null, CAPA=Object.assign({prov:{},ped:{},bor:{}},lsGet(LS,{})), AJ=Object.assign({},AJ_DEF,lsGet(LSA,{}));
AJ.pesos=Object.assign({},AJ_DEF.pesos,AJ.pesos||{});
let D=null, TAB=(["hoy","listos","pedidos","tramites","prov","aquien","precios","rapidez","kraljic","proc"].includes(location.hash.slice(1))?location.hash.slice(1):"hoy");

function fusion(){
  const b=BASE||{};
  const prov=(b.proveedores||[]).map(p=>Object.assign({},p,CAPA.prov[p.id]||{}));
  Object.values(CAPA.prov).forEach(p=>{if(p&&p._nuevo&&!prov.some(x=>x.id===p.id))prov.push(Object.assign({},p));});
  const ped=(b.pedidos||[]).map(p=>Object.assign({},p,CAPA.ped[p.id]||{}));
  Object.values(CAPA.ped).forEach(p=>{if(p&&p._nuevo&&!ped.some(x=>x.id===p.id))ped.push(Object.assign({},p));});
  ped.forEach(p=>{p.pendiente=!CERRADOS.has(p.estado);});
  D={corte:AJ.fechaHoy?new Date().toISOString().slice(0,10):(b.corte||new Date().toISOString()).slice(0,10),
     fuente:b.fuente||"",categorias:b.categorias||[],proveedores:prov,pedidos:ped,precios:b.precios||[],solicitudes:b.solicitudes||[],notas_analista:b.notas_analista||[],
     fincas:b.fincas||[],personas:b.personas||[],tramites:(b.tramites||[]).map((t,i)=>Object.assign({id:"t"+i},t,(CAPA.tra||{})["t"+i]||{})),
     borradores:(b.borradores||[]).map(x=>Object.assign({},x,CAPA.bor[x.id]||{}))};
  D.byId={};prov.forEach(p=>D.byId[p.id]=p);
  D.finca={};D.fincas.forEach(f=>D.finca[f.id]=f);
  calcularPuntajes();
}
const nomProv=id=>D.byId[id]?D.byId[id].nombre:(id?id:"Sin proveedor aún");
const nomFinca=id=>id&&D.finca[id]?D.finca[id].nombre:(id||"—");
const ivaPct=x=>x.iva_pct!=null?x.iva_pct:15;

/* ====== Puntaje del proveedor ====== */
function calcularPuntajes(){
  const porItem={};
  D.precios.forEach(x=>{if(x.precio==null)return;const k=norm(x.item);(porItem[k]=porItem[k]||[]).push(x);});
  const P=AJ.pesos, tot=Object.values(P).reduce((a,b)=>a+Number(b||0),0)||1;
  D.proveedores.forEach(p=>{
    const m=p.metricas||{};
    const med=m.mediana_respuesta_min;
    const rap=med==null?50:med<=15?100:med<=60?80:med<=240?60:med<=1440?40:20;
    const res=m.solicitudes?Math.min(1,(m.respondidas||0)/m.solicitudes)*100:50;
    const comps=[];
    Object.values(porItem).forEach(lst=>{const provs=new Set(lst.map(x=>x.proveedor_id));if(provs.size<2)return;
      const min=Math.min(...lst.map(x=>x.precio));const mio=lst.filter(x=>x.proveedor_id===p.id);if(!mio.length)return;
      const mp=Math.min(...mio.map(x=>x.precio));comps.push(mp>0?min/mp*100:100);});
    const pre=comps.length?comps.reduce((a,b)=>a+b,0)/comps.length:50;
    const dis=m.solicitudes?Math.max(0,1-(m.sin_stock||0)/m.solicitudes)*100:50;
    const cum=m.entregas_total?((m.entregas_a_tiempo||0)/m.entregas_total)*100:50;
    p._comp={rapidez:rap,respuesta:res,precio:pre,disponibilidad:dis,cumplimiento:cum,comparables:comps.length};
    p._score=Math.round((rap*P.rapidez+res*P.respuesta+pre*P.precio+dis*P.disponibilidad+cum*P.cumplimiento)/tot);
    p._clase=p._score>=75?"A":p._score>=55?"B":"C";
  });
}
const claseHtml=p=>`<span class="clase ${p._clase==="A"?"c-ok":p._clase==="B"?"c-md":"c-cr"}" title="${esc(desglose(p))}">${p._clase}</span>`;
function desglose(p){const c=p._comp||{};return `Puntaje ${p._score}/100 · Rapidez ${Math.round(c.rapidez)} · Respuesta ${Math.round(c.respuesta)} · Precio ${Math.round(c.precio)}${c.comparables?" ("+c.comparables+" ítems comparados)":" (sin comparables)"} · Disponibilidad ${Math.round(c.disponibilidad)} · Cumplimiento ${Math.round(c.cumplimiento)}`;}
const chipEstado=e=>{const x=ESTADOS[e]||[e||raya,"c-gr"];return `<span class="chip ${x[1]}">${esc(x[0])}</span>`;};
const itemsTxt=p=>(p.items||[]).map(i=>[i.cantidad!=null?i.cantidad:"",i.unidad||"",i.descripcion||""].join(" ").trim()).join("; ")||raya;

/* ====== Mensajes ====== */
function saludo(p){const c=p&&p.contacto?p.contacto:"";return c?`Estimado/a ${c}, buenos días.`:"Buenos días, estimado/a.";}
function msgCotizacion(prov,items,lugar,finca){const f=finca&&D.finca[finca];const ent=f?f.entrega+" ("+f.ubicacion+")":(lugar||"finca AgroDávila (por confirmar)");
  return `${saludo(prov)} Le saluda ${AJ.firma||"el Ing. Wilson Pérez, encargado de compras de AgroDávila"}.\n\nPor favor, ¿nos ayuda con una cotización formal${f?" para la finca "+f.nombre:""} de:\n${items.map(i=>"• "+i).join("\n")}\n\nPor favor incluya:\n1. Precio unitario y total, sin IVA y con IVA\n2. Stock disponible hoy; si no hay, en cuántos días lo tendrían\n3. Tiempo de entrega en días desde la orden de compra, en ${ent}\n4. ¿El precio incluye la entrega en la finca? Si el transporte se cobra aparte, ¿cuánto cuesta?\n5. Forma de pago: contado o crédito. ¿A cuántos días? ¿Qué necesitan para abrirnos crédito?\n6. Descuento por volumen o pronto pago\n7. Validez de la cotización\n8. Marca y especificaciones; garantía, o registro de Agrocalidad y vencimiento si es agroquímico\n${f?"\nFacturar a: "+f.facturar_a.replace(" (confirmar con Contabilidad)","")+". Correo: compras@agrodavila.com.\n":""}\nMuchas gracias.`;}
function msgSeguimiento(p){const prov=D.byId[p.proveedor_id];const it=itemsTxt(p);
  if(p.estado==="cotizacion_pedida")return `${saludo(prov)} Le escribo para dar seguimiento a la cotización que le pedimos el ${fecha(p.fecha)}: ${it}.\n¿Nos ayuda con el precio y el tiempo de entrega, por favor? Gracias.`;
  if(p.estado==="facturado"||/factura/i.test(p.proxima_accion||""))return `${saludo(prov)} Por favor, ¿nos ayuda con la factura de ${it}${p.odc?" (ODC "+p.odc+")":""}? Contabilidad la necesita para procesar el pago. Gracias.`;
  return `${saludo(prov)} Le escribo para dar seguimiento a nuestro pedido${p.odc?" con ODC "+p.odc:""} del ${fecha(p.fecha)}: ${it}.${p.fecha_compromiso?"\nLa fecha comprometida era el "+fecha(p.fecha_compromiso)+".":""}\n¿Nos confirma la fecha de despacho y llegada a la finca${p.finca?" "+p.finca:""}, por favor? Gracias.`;}

/* ====== Persistencia de cambios ====== */
function guardarPed(id,cambio){CAPA.ped[id]=Object.assign({},CAPA.ped[id]||{},cambio);lsSet(LS,CAPA);fusion();pintar();}
function guardarBor(id,cambio){CAPA.bor[id]=Object.assign({},CAPA.bor[id]||{},cambio);lsSet(LS,CAPA);fusion();pintar();}
function guardarTra(id,cambio){CAPA.tra=CAPA.tra||{};CAPA.tra[id]=Object.assign({},CAPA.tra[id]||{},cambio);lsSet(LS,CAPA);fusion();pintar();}
function guardarProv(id,cambio){CAPA.prov[id]=Object.assign({},CAPA.prov[id]||{},cambio);lsSet(LS,CAPA);fusion();pintar();}

/* ====== Pestañas ====== */
const TABS=[["asis","Asistente"],["hoy","Hoy"],["listos","Mensajes listos"],["pedidos","Pedidos y cotizaciones"],["tramites","Facturas y pagos"],["prov","Proveedores"],["aquien","¿A quién le pido?"],["precios","Precios"],["rapidez","Rapidez"],["kraljic","Segmentación"],["msgs","Plantillas"],["proc","Cómo trabajar"],["ajustes","Ajustes"]];
function pintarNav(){$("#nav").innerHTML=TABS.map(([k,t])=>`<button role="tab" type="button" aria-selected="${k===TAB}" data-tab="${k}">${t}</button>`).join("");}
document.addEventListener("click",e=>{const t=e.target.closest("[data-tab]");if(t){TAB=t.dataset.tab;pintar();window.scrollTo(0,0);}});

function pintar(){pintarNav();
  $("#sub").textContent=`Corte: ${fecha(D.corte)} · ${D.proveedores.length} proveedores · ${D.pedidos.filter(p=>p.pendiente).length} pendientes${D.fuente?" · "+D.fuente:""}`;
  ({asis:vAsistente,hoy:vHoy,listos:vListos,pedidos:vPedidos,tramites:vTramites,prov:vProv,aquien:vAquien,precios:vPrecios,rapidez:vRapidez,kraljic:vKraljic,msgs:vMsgs,proc:vProc,ajustes:vAjustes})[TAB]();}

/* --- Hoy --- */
function tareas(){
  const T=[];
  D.pedidos.filter(p=>p.pendiente).forEach(p=>{
    const abiertos=dias(p.fecha,D.corte), prov=D.byId[p.proveedor_id];
    const venc=p.fecha_compromiso?dias(p.fecha_compromiso,D.corte):null;
    let nivel=null,motivo="";
    if(venc!=null&&venc>0){nivel=0;motivo=`Fecha comprometida vencida hace ${venc} d`;}
    else if(p.estado==="cotizacion_pedida"&&abiertos!=null&&abiertos>AJ.diasCot){nivel=1;motivo=`Cotización sin respuesta hace ${abiertos} d`;}
    else if(abiertos!=null&&abiertos>AJ.diasPed){nivel=2;motivo=`Abierto hace ${abiertos} d`;}
    else if(p.estado==="cotizacion_pedida"||p.estado==="cotizado"){nivel=3;motivo=p.estado==="cotizado"?"Cotización recibida: decidir y aprobar":"Cotización pedida, esperando";}
    else {nivel=3;motivo="En curso";}
    if(prov&&prov.ultimo_contacto){const u=dias(prov.ultimo_contacto,D.corte);if(u!=null&&u>30){motivo+=` · sin contacto hace ${u} d`;nivel=Math.min(nivel,2);}}
    T.push({p,nivel,motivo,abiertos});});
  return T.sort((a,b)=>a.nivel-b.nivel||(b.abiertos||0)-(a.abiertos||0));
}

/* --- Tablas ordenables --- */
const ORD={};
function tabla(id,cols,filas){const o=ORD[id]||{};
  if(o.k!=null){const c=cols[o.k];filas=filas.slice().sort((a,b)=>{let x=c.v(a),y=c.v(b);if(x==null)return 1;if(y==null)return -1;return (typeof x==="number"&&typeof y==="number"?x-y:String(x).localeCompare(String(y),"es"))*(o.d?-1:1);});}
  return `<div class="tw"><table id="${id}"><thead><tr>${cols.map((c,i)=>`<th class="${c.num?"num":""}${c.v?"":" nosort"}" ${c.v?`data-ord="${id}:${i}" tabindex="0" aria-sort="${o.k===i?(o.d?"descending":"ascending"):"none"}"`:""}>${c.t}${o.k===i?(o.d?" ▼":" ▲"):""}</th>`).join("")}</tr></thead>
  <tbody>${filas.length?filas.map(f=>`<tr>${cols.map(c=>`<td class="${c.num?"num":""}">${c.h(f)}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${cols.length}" class="muted">Sin resultados</td></tr>`}</tbody></table></div>`;}
function ordenar(el){const [id,i]=el.dataset.ord.split(":");const o=ORD[id]||{};ORD[id]={k:+i,d:o.k===+i?!o.d:false};pintar();}
document.addEventListener("click",e=>{const t=e.target.closest("[data-ord]");if(t)ordenar(t);});
document.addEventListener("keydown",e=>{const t=e.target.closest&&e.target.closest("[data-ord]");if(t&&(e.key==="Enter"||e.key===" ")){e.preventDefault();ordenar(t);}});

/* --- ¿A quién le pido? --- */
let AQ={q:"",sel:new Set(),lugar:"",finca:""};
function candidatos(q){const nq=norm(q).trim();if(!nq)return [];const palabras=nq.split(/\s+/).filter(w=>w.length>2);
  const hit=t=>{const n=norm(t);return n.includes(nq)||(palabras.length&&palabras.every(w=>n.includes(w)));};
  return D.proveedores.map(p=>{const prs=D.precios.filter(x=>x.proveedor_id===p.id&&hit(x.item+" "+(x.categoria||"")));
    const porProd=(p.productos||[]).filter(hit), porCat=(p.categorias||[]).filter(hit);
    if(!prs.length&&!porProd.length&&!porCat.length)return null;
    const ult=prs.slice().sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)))[0];
    return {p,ult,motivo:[...porProd,...porCat].slice(0,3).join(", ")||(ult?ult.item:"")};}).filter(Boolean)
    .filter(c=>{const f=AQ.finca&&D.finca[AQ.finca];return !f||!c.p.zona||c.p.zona===f.zona||c.p.zona==="Nacional";})
    .sort((a,b)=>{const f=AQ.finca&&D.finca[AQ.finca];const z=c=>f&&c.p.zona===f.zona?1:0;return z(b)-z(a)||b.p._score-a.p._score;});}

  <div class="filtros"><select id="aqf" aria-label="Finca que pide"><option value="">¿Para qué finca?</option>${D.fincas.map(f=>`<option value="${esc(f.id)}" ${f.id===AQ.finca?"selected":""}>${esc(f.nombre)} · ${esc(f.zona)}</option>`).join("")}</select>
  <input type="search" id="aq" placeholder="Producto o categoría: alambre, bomba, agua, rulimán…" value="${esc(AQ.q)}" style="flex:1;min-width:220px" aria-label="Producto a buscar"></div>
  ${AQ.finca&&D.finca[AQ.finca]?`<p class="small muted">Solo proveedores de ${esc(D.finca[AQ.finca].zona)} o nacionales. Entrega: ${esc(D.finca[AQ.finca].entrega)}.</p>`:""}

  ${tabla("tA",[

    {t:"Responde en",num:1,v:c=>(c.p.metricas||{}).mediana_respuesta_min,h:c=>dur((c.p.metricas||{}).mediana_respuesta_min)},
    {t:"Ojo",h:c=>{const m=c.p.metricas||{};const o=[];if(m.sin_stock)o.push(m.sin_stock+" veces sin stock");if(m.solicitudes&&m.respondidas<m.solicitudes)o.push((m.solicitudes-m.respondidas)+" sin responder");if(c.p.estado&&c.p.estado!=="activo")o.push(c.p.estado);return esc(o.join(" · ")||raya);}}],C)}
  <h3>Armar solicitud de cotización</h3>

/* --- Rapidez --- */
function vRapidez(){
  const L=D.proveedores.filter(p=>(p.metricas||{}).mediana_respuesta_min!=null).sort((a,b)=>a.metricas.mediana_respuesta_min-b.metricas.mediana_respuesta_min);
  const sin=D.proveedores.filter(p=>(p.metricas||{}).mediana_respuesta_min==null);
  const mx=Math.log10(Math.max(...L.map(p=>p.metricas.mediana_respuesta_min),60)+1);

  $("#main").innerHTML=`<div class="card"><h2>¿Quién responde más rápido?</h2>

  ${L.map(p=>{const m=p.metricas.mediana_respuesta_min,w=Math.max(3,Math.log10(m+1)/mx*100);const r=p.metricas.solicitudes?Math.round(p.metricas.respondidas/p.metricas.solicitudes*100)+" % resp.":"";
    return `<div class="rk"><button class="lnk" data-prov="${esc(p.id)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.nombre)}</button><div title="${esc(r)}"><div class="barra" style="width:${w}%;background:${color(m)}"></div></div><div class="num small">${dur(m)}</div></div>`;}).join("")||`<p class="muted">Sin tiempos medidos.</p>`}
  ${sin.length?`<h3>Sin datos suficientes (${sin.length})</h3><p class="small muted">${sin.map(p=>esc(p.nombre)).join(" · ")}</p>`:""}</div>`;
}

/* --- Kraljic --- */
function vKraljic(){
  const cats={};D.proveedores.forEach(p=>(p.categorias||[]).forEach(c=>{(cats[c]=cats[c]||{c,provs:new Set(),gasto:0,peds:0}).provs.add(p.id);}));
  D.pedidos.forEach(x=>{const p=D.byId[x.proveedor_id];const c=(x.categoria)||(p&&(p.categorias||[])[0]);if(!c)return;(cats[c]=cats[c]||{c,provs:new Set(),gasto:0,peds:0});cats[c].gasto+=Number(x.total)||0;cats[c].peds++;});
  const L=Object.values(cats);const gastos=L.map(x=>x.gasto).sort((a,b)=>a-b);const medG=gastos.length?gastos[Math.floor(gastos.length/2)]:0;
  L.forEach(x=>{const n=x.provs.size;x.riesgo=n<=1?"alto":n===2?"medio":"bajo";const altoG=x.gasto>medG||(medG===0&&x.peds>1);const altoR=n<=2;
    x.q=altoG&&altoR?"est":altoG?"apa":altoR?"cue":"rut";});
  const Q={est:["Estratégico","Gasto alto y pocos proveedores: cuida la relación, acuerda precios y plazos por escrito y busca un segundo proveedor."],
    cue:["Cuello de botella","Poco gasto pero pocos proveedores: asegura stock de seguridad y encuentra alternativas antes de que falte."],
    apa:["Apalancamiento","Gasto alto y muchos proveedores: negocia por volumen y compara siempre 3 cotizaciones."],
    rut:["Rutinario","Poco gasto y muchos proveedores: simplifica, compra al más rápido y agrupa pedidos."]};
  const caja=k=>`<div><h4>${Q[k][0]}</h4><p>${Q[k][1]}</p>${L.filter(x=>x.q===k).map(x=>`<span class="chip ${x.riesgo==="alto"?"c-cr":x.riesgo==="medio"?"c-md":"c-ok"}" style="margin:2px" title="${x.provs.size} proveedor(es) · ${usd(x.gasto)}">${esc(x.c)}</span>`).join(" ")||'<span class="small muted">—</span>'}</div>`;
  const solo=L.filter(x=>x.provs.size===1);
  $("#main").innerHTML=`<div class="card"><h2>Segmentación de categorías (Kraljic)</h2>
  <p class="small muted">Eje de impacto: gasto registrado por categoría (sobre o bajo la mediana). Eje de riesgo: cuántos proveedores tienes en esa categoría (1 alto · 2 medio · 3 o más bajo). Color del chip = riesgo.</p>
  <div class="kq">${caja("cue")}${caja("est")}${caja("rut")}${caja("apa")}</div></div>
  <div class="card"><h2>Riesgo de dependencia: categorías con un solo proveedor (${solo.length})</h2>
  ${solo.length?`<ul>${solo.map(x=>`<li><b>${esc(x.c)}</b>: solo ${esc(nomProv([...x.provs][0]))}. Busca un segundo proveedor.</li>`).join("")}</ul>`:`<p class="muted">Ninguna.</p>`}</div>
  <div class="card"><h2>Resumen por categoría</h2>${tabla("tK",[
    {t:"Categoría",v:x=>x.c,h:x=>esc(x.c)},{t:"Proveedores",num:1,v:x=>x.provs.size,h:x=>x.provs.size},{t:"Pedidos",num:1,v:x=>x.peds,h:x=>x.peds},
    {t:"Gasto registrado",num:1,v:x=>x.gasto,h:x=>usd(x.gasto)},{t:"Cuadrante",v:x=>x.q,h:x=>Q[x.q][0]}],L)}</div>`;
}

     ${(t.items||[]).length?`<p class="small">${t.items.map(i=>esc([i.cantidad,i.unidad,i.descripcion].filter(Boolean).join(" "))).join(" · ")}</p>`:""}
     ${(t.borradores||[]).map(b=>`<div style="border-top:1px solid var(--bd);padding-top:8px;margin-top:8px"><div class="small"><b>${b.tipo==="acuse"?"Respuesta a "+esc(b.proveedor):"Cotización a "+esc(b.proveedor)}</b> · chat «${esc(b.chat)}» <span class="chip ${b.estado==="enviado"?"c-ok":b.estado==="descartado"?"c-gr":b.estado==="fallo_envio"?"c-cr":"c-al"}">${esc(b.estado)}</span>${b.error?` <span style="color:var(--cr)">${esc(b.error)}</span>`:""}</div>
       <textarea data-abtxt="${b.id}" style="min-height:${b.tipo==="acuse"?80:200}px" ${b.estado==="enviado"?"readonly":""}>${esc(b.texto)}</textarea>
       ${b.estado==="propuesto"||b.estado==="fallo_envio"?`<div class="filtros" style="margin:6px 0 0"><button class="btn sm pri" type="button" data-aenv="${b.id}">Revisar y enviar</button><button class="btn sm" type="button" data-ades="${b.id}">Descartar</button></div>`:""}</div>`).join("")}
   </div>`).join(""):`<div class="card"><p class="muted">${w==="listo"?"Sin pedidos nuevos por ahora. Te aviso apenas llegue uno.":"Cuando WhatsApp Web esté vinculado, aquí aparecerá lo que te pidan."}</p></div>`}`;
  const rev=$("#asRev");if(rev)rev.onclick=()=>{rev.disabled=true;rev.textContent="Revisando…";postAgente("/asistente/revisar",{}).then(j=>{toast(j.ok?`Listo: ${j.nuevas||0} pedido(s) nuevo(s)`:(j.error||"No se pudo revisar"));cargarAsistente();});};
  const re=$("#asRe");if(re)re.onclick=cargarAsistente;
  document.querySelectorAll("[data-tok]").forEach(b=>b.onclick=()=>postAgente(`/tareas/${b.dataset.tok}/estado`,{estado:"hecha"}).then(cargarAsistente));
  document.querySelectorAll("[data-tdes]").forEach(b=>b.onclick=()=>postAgente(`/tareas/${b.dataset.tdes}/estado`,{estado:"descartada"}).then(cargarAsistente));
  document.querySelectorAll("[data-ades]").forEach(b=>b.onclick=()=>postAgente("/borradores/descartar",{id:+b.dataset.ades}).then(cargarAsistente));
  document.querySelectorAll("[data-aenv]").forEach(b=>b.onclick=()=>{const bid=+b.dataset.aenv;const t=ASIS.tareas.find(x=>x.borradores.some(y=>y.id===bid));const bo=t.borradores.find(y=>y.id===bid);
    const txt=document.querySelector(`[data-abtxt="${bid}"]`).value;abrirEnvio({id:"b"+bid,chat:bo.chat,nombre:bo.proveedor,finca:null,tipo:bo.tipo,original:bo.texto},txt,false);});
  document.querySelectorAll("[data-tign]").forEach(b=>b.onclick=()=>{if(!confirm(`¿Dejar de revisar el chat «${b.dataset.tign}»? Puedes restaurarlo luego.`))return;postAgente("/aprendizaje/ignorar",{chat:b.dataset.tign}).then(()=>{toast("Aprendido: ese chat ya no se revisa");cargarAsistente();});});
  document.querySelectorAll("[data-trest]").forEach(b=>b.onclick=()=>postAgente("/aprendizaje/restaurar",{chat:b.dataset.trest}).then(()=>{toast("Chat restaurado");cargarAsistente();}));
}
function enviarAProveedor(pid,texto,ref,finca){const p=D.byId[pid];if(!p){toast("Elige un proveedor");return;}
  abrirEnvio({id:ref||("libre-"+Date.now()),chat:p.chat,proveedor_id:pid,finca:finca||null},texto,false);}

/* --- Facturas, pagos y devoluciones --- */
const TIPO_TRA={factura:["Factura por recibir","c-az"],pago:["Pago","c-al"],devolucion:["Devolución","c-md"],entrega:["Entrega","c-ok"]};
function vTramites(){
  const L=D.tramites.slice().sort((a,b)=>(a.estado==="hecho")-(b.estado==="hecho")||String(a.desde).localeCompare(String(b.desde)));
  $("#main").innerHTML=`<div class="card"><h2>Facturas, pagos y devoluciones por cerrar</h2>
  <p class="small muted">Lo que no es una compra nueva pero sí está pendiente con proveedores. Los pagos los aprueba y ejecuta Contabilidad; la contadora apoya con facturas y contabilidad.</p>
  ${tabla("tT",[
    {t:"Desde",v:t=>t.desde,h:t=>fecha(t.desde)},
    {t:"Días",num:1,v:t=>dias(t.desde,D.corte),h:t=>dias(t.desde,D.corte)??raya},
    {t:"Tipo",v:t=>t.tipo,h:t=>{const x=TIPO_TRA[t.tipo]||[t.tipo,"c-gr"];return `<span class="chip ${x[1]}">${x[0]}</span>`;}},
    {t:"Proveedor",v:t=>nomProv(t.proveedor_id),h:t=>t.proveedor_id?`<button class="lnk" data-prov="${esc(t.proveedor_id)}">${esc(nomProv(t.proveedor_id))}</button>`:"—"},
    {t:"Detalle",v:t=>t.detalle,h:t=>esc(t.detalle)},
    {t:"Responsable",v:t=>t.responsable,h:t=>esc(t.responsable||raya)},
    {t:"Estado",v:t=>t.estado,h:t=>`<select data-tra="${esc(t.id)}" aria-label="Estado del trámite">${["pendiente","reclamo","programar","seguimiento","responder","verificar","hecho"].map(s=>`<option ${s===t.estado?"selected":""}>${s}</option>`).join("")}</select>`}],L)}</div>`;
  document.querySelectorAll("[data-tra]").forEach(s=>s.onchange=()=>{guardarTra(s.dataset.tra,{estado:s.value});toast("Guardado");});
}

/* --- Cómo trabajar (procedimiento) --- */
function vProc(){
  const fin=D.fincas.map(f=>`<tr><td><b>${esc(f.nombre)}</b></td><td>${esc(f.zona)}</td><td>${esc(f.ubicacion)}</td><td>${esc(f.entrega)}</td><td>${esc(f.responsable||raya)}</td><td class="small">${esc(f.facturar_a)}</td></tr>`).join("");
  const per=D.personas.map(p=>`<li><b>${esc(p.nombre)}</b>: ${esc(p.rol)} <span class="muted small">(${esc(p.canal)})</span></li>`).join("");
  $("#main").innerHTML=`<div class="card"><h2>Cómo trabajar una compra de principio a fin</h2>
  <ol>
   <li><b>Recibir el pedido.</b> Todo pedido debe estar en AgroControl con finca, cantidad, unidad y urgencia. Si llega por WhatsApp (grupos de fincas, la contadora), pide al solicitante que lo registre o regístralo tú el mismo día y responde «recibido, lo cotizo hoy».</li>
   <li><b>Revisar antes de cotizar.</b> ¿Ya se compró antes? Mira «Precios». ¿Hay stock en otra finca? ¿La especificación está completa (medidas, marca, ingrediente activo, presentación)? Si falta un dato, pregúntalo antes de cotizar: una cotización con datos incompletos se pierde.</li>
   <li><b>Pedir mínimo 3 cotizaciones</b> a proveedores de la <b>zona de la finca</b> (Costa: Puerto Cayo y El Carmen · Imbabura: Coñaqui, Eliana, Andrés López, Otoburo), o nacionales que entreguen allí. Usa «Mensajes listos»: cada mensaje dice finca, lugar de entrega y a quién facturar, y pide precio con y sin IVA, entrega, transporte, forma de pago y validez.</li>
   <li><b>Plazo de respuesta:</b> si no responden en 24 horas, envía un recordatorio; a las 48 horas, busca otro proveedor. Esto baja su puntaje de rapidez.</li>
   <li><b>Comparar con criterio:</b> precio total con IVA y transporte, tiempo de entrega a la finca, crédito, garantía, historial del proveedor (puntaje A/B/C). Registra todas las cotizaciones en AgroControl, no solo la elegida.</li>
   <li><b>Seleccionar y pedir autorización:</b> en AgroControl, seleccionado → OK de Contabilidad, Administración y Gerencia. Sin los OK no se compra ni se promete nada al proveedor. Al proveedor no elegido, agradece y avísale.</li>
   <li><b>Orden de compra:</b> genera la OC en AgroControl (una por proveedor y por finca, porque contabilidad pide una factura por OC) y envíala por el chat del proveedor con la fecha de entrega comprometida.</li>
   <li><b>Pago:</b> Contabilidad ejecuta los pagos. Envía al grupo «Proveedores AGD» la OC y la factura o proforma; no envíes datos bancarios sueltos (la OC ya los tiene). Al proveedor, envía el comprobante con «PAGO OC ####».</li>
   <li><b>Despacho y entrega:</b> pide número de guía o transporte. Confirma con el responsable de la finca que llegó completo y anota la fecha de entrega: así medimos el lead time real.</li>
   <li><b>Factura y cierre:</b> exige la factura a nombre correcto, una por OC. Pásala a la contadora. Cierra la OC en AgroControl. Si hubo diferencias (faltantes o devoluciones), regístralas en «Facturas y pagos».</li>
  </ol>
  <h3>Reglas de oro</h3>
  <ul><li>Nada se compra sin la autorización de AgroControl. Las cotizaciones de antes de noviembre (época de Edwin) no están aprobadas.</li>
  <li>Cotiza solo lo que de verdad se va a comprar: a los proveedores les molesta cotizar sin vender (por ejemplo, Ferroeléctrico).</li>
  <li>Responde a cada proveedor, aunque sea para decir que no.</li>
  <li>Revisa las categorías con un solo proveedor (pestaña «Segmentación»): consigue un segundo proveedor.</li></ul></div>
  <div class="card"><h2>Fincas y entregas</h2><div class="tw"><table><thead><tr><th class="nosort">Finca</th><th class="nosort">Zona</th><th class="nosort">Ubicación</th><th class="nosort">Entrega</th><th class="nosort">Solicita</th><th class="nosort">Facturar a</th></tr></thead><tbody>${fin}</tbody></table></div></div>
  <div class="card"><h2>Personas</h2><ul>${per}</ul></div>
  <div class="card"><h2>Rutina diaria (20 minutos)</h2><ol>
   <li>08:00 · «Hoy» de esta app: revisa los cuatro grupos (por cotizar, por decidir, generar OC y en curso).</li>
   <li>08:10 · «Mensajes listos»: revisa y envía las cotizaciones y los seguimientos.</li>
   <li>11:00 y 15:00 · Registra en AgroControl las cotizaciones que llegaron; las que faltan, recuérdalas.</li>
   <li>16:00 · Pide autorizaciones a Contabilidad y Gerencia en un solo mensaje con el resumen.</li>
   <li>Viernes · «Facturas y pagos»: cierra facturas y reclamos de la semana con la contadora.</li></ol></div>`;
}

/* --- Ajustes --- */
function vAjustes(){const P=AJ.pesos;
  $("#main").innerHTML=`<div class="card"><h2>Pesos del puntaje de proveedores</h2><div class="grid2">
  ${Object.entries({rapidez:"Rapidez de respuesta",respuesta:"% de solicitudes respondidas",precio:"Precio frente a otros",disponibilidad:"Disponibilidad (tiene stock)",cumplimiento:"Cumplimiento de entregas"}).map(([k,t])=>`<div class="campo"><label for="w_${k}">${t}</label><input id="w_${k}" type="number" min="0" max="100" value="${P[k]}"></div>`).join("")}</div>
  <h2 style="margin-top:16px">Alertas</h2><div class="grid2">
  <div class="campo"><label for="a1">Días para insistir en una cotización</label><input id="a1" type="number" min="0" value="${AJ.diasCot}"></div>
  <div class="campo"><label for="a2">Días para marcar un pedido como atrasado</label><input id="a2" type="number" min="0" value="${AJ.diasPed}"></div>
  <div class="campo"><label><input type="checkbox" id="a3" ${AJ.fechaHoy?"checked":""}> Contar los días hasta hoy (no hasta la fecha de corte)</label></div>
  <div class="campo"><label for="a4">Firma en los mensajes («Le saluda …»)</label><input id="a4" value="${esc(AJ.firma||"")}" placeholder="Wilo, de Compras de AgroDávila"></div></div>
  <p><button class="btn pri" type="button" id="gA">Guardar ajustes</button> <button class="btn" type="button" id="rA">Volver a los valores originales</button></p></div>
  <div class="card"><h2>Mis cambios</h2><p class="small muted">Tienes ${Object.keys(CAPA.ped).length} pedidos y ${Object.keys(CAPA.prov).length} proveedores con cambios guardados en este computador.</p>
  <button class="btn" type="button" id="bBorrar">Borrar mis cambios</button></div>`;
  $("#gA").onclick=()=>{Object.keys(P).forEach(k=>AJ.pesos[k]=Math.max(0,Number($("#w_"+k).value)||0));AJ.diasCot=Number($("#a1").value)||0;AJ.diasPed=Number($("#a2").value)||0;AJ.fechaHoy=$("#a3").checked;AJ.firma=$("#a4").value.trim();lsSet(LSA,AJ);fusion();pintar();toast("Ajustes guardados");};
  $("#rA").onclick=()=>{AJ=Object.assign({},AJ_DEF,{tema:AJ.tema,firma:AJ.firma,pesos:Object.assign({},AJ_DEF.pesos)});lsSet(LSA,AJ);fusion();pintar();toast("Valores originales");};
  $("#bBorrar").onclick=()=>{if(!confirm("¿Borrar todos tus cambios guardados en este computador?"))return;CAPA={prov:{},ped:{},bor:{},tra:{}};lsSet(LS,CAPA);fusion();pintar();toast("Cambios borrados");};
}

/* ====== Importar / exportar / tema ====== */
$("#bImp").onclick=()=>$("#fImp").click();
$("#fImp").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{let t=String(r.result);if(!/^\s*\{/.test(t)){t=t.slice(t.indexOf("{"),t.lastIndexOf("}")+1);}
  const obj=JSON.parse(t);if(!obj||!Array.isArray(obj.proveedores))throw new Error("forma");BASE=obj;$("#bannerEj").classList.add("hidden");fusion();pintar();toast("Datos importados");}catch(err){alert("No pude leer ese archivo. Debe ser el JSON de compras (con «proveedores»).");}};r.readAsText(f,"utf-8");e.target.value="";};
$("#bExp").onclick=()=>{const o=Object.assign({},BASE,{proveedores:D.proveedores.map(p=>{const c=Object.assign({},p);delete c._comp;delete c._score;delete c._clase;return c;}),pedidos:D.pedidos,borradores:D.borradores,tramites:D.tramites,exportado:new Date().toISOString()});descargar("compras_whatsapp_"+new Date().toISOString().slice(0,10)+".json",JSON.stringify(o,null,1),"application/json");};
function aplicarTema(){if(AJ.tema)document.documentElement.dataset.theme=AJ.tema;else delete document.documentElement.dataset.theme;}
$("#bTema").onclick=()=>{const osc=AJ.tema?AJ.tema==="dark":matchMedia("(prefers-color-scheme:dark)").matches;AJ.tema=osc?"light":"dark";lsSet(LSA,AJ);aplicarTema();};

/* ====== Inicio ====== */
aplicarTema();
(async()=>{ try{ await ComprasApp.exigirSesion(); }catch(e){ return; }
  let d=null; try{ d=await ComprasApp.datosWA(); }catch(e){ $("#main").innerHTML=`<div class="card"><b>${esc(e.message)}</b> <a href="index.html">Volver a escribir la clave de datos</a></div>`; return; }
  if(!d){ $("#main").innerHTML=`<div class="card"><b>Falta la clave de datos.</b> <a href="index.html">Escribirla en Inicio</a></div>`; return; }
  window.DATOS_COMPRAS=d; BASE=d; fusion(); pintar(); })();
</script>
