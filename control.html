<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de Compras AgroDávila</title>
<meta name="theme-color" content="#23262B"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="iconos/icono-192.png"><link rel="apple-touch-icon" href="iconos/icono-192.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" crossorigin="anonymous"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" crossorigin="anonymous"></script><script src="etapas.js"></script><script src="comun.js"></script><script src="guia.js"></script><script src="firebase_config.js"></script><script src="nube.js"></script><link rel="stylesheet" href="marco.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">


<style>
:root{--bg:#F4F6F3;--card:#FFFFFF;--tx:#1D2A22;--t2:#5E6B63;--bd:#DDE3DE;--ok:#2E7D4F;--okbg:#E5F3EA;--md:#B7791F;--mdbg:#FDF3DC;--al:#C2591B;--albg:#FCE9DC;--cr:#B42318;--crbg:#FBE4E2;--pri:#1F5E3B;--pri2:#E3EFE7;--az:#0F4C81}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1B231F;--tx:#E6ECE8;--t2:#9AA9A0;--bd:#2C3832;--okbg:#1E3A2A;--mdbg:#3A2F17;--albg:#3D2618;--crbg:#43201D;--pri:#5FB386;--pri2:#21342A;--az:#7FB2E5}}
:root[data-theme="dark"]{--bg:#121815;--card:#1B231F;--tx:#E6ECE8;--t2:#9AA9A0;--bd:#2C3832;--okbg:#1E3A2A;--mdbg:#3A2F17;--albg:#3D2618;--crbg:#43201D;--pri:#5FB386;--pri2:#21342A;--az:#7FB2E5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
h1{font-size:17px;margin:0;color:var(--pri)}.sub{color:var(--t2);font-size:12px}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--pri)}.btn.p{background:var(--pri);color:#fff;border-color:var(--pri)}
nav{display:flex;gap:4px;padding:8px 16px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--bd)}
nav button{border:0;background:none;color:var(--t2);padding:8px 12px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--pri2);color:var(--pri)}
main{padding:16px;max-width:1280px;margin:0 auto}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px}.kpi .l{font-size:12px;color:var(--t2)}.kpi .m{font-size:11px;color:var(--t2);margin-top:2px}
.sec{margin:20px 0 8px;font-size:15px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--t2);position:sticky;top:0;background:var(--card)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;max-height:70vh}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.Crítica{background:var(--crbg);color:var(--cr)}.Alta{background:var(--albg);color:var(--al)}.Media{background:var(--mdbg);color:var(--md)}.Baja,.ok{background:var(--okbg);color:var(--ok)}
.filtros{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
select,input[type=search]{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:7px 9px;font:inherit}
.bar{height:10px;border-radius:5px;background:var(--pri)}.barw{background:var(--pri2);border-radius:5px;flex:1}
.fila{display:flex;align-items:center;gap:10px;margin:6px 0}.fila .et{width:250px;font-size:13px}.fila .num{width:150px;text-align:right;font-size:12px;color:var(--t2)}
.aviso{background:var(--crbg);color:var(--cr);border-radius:10px;padding:10px 14px;font-weight:600;margin-bottom:12px}
.nota{font-size:12px;color:var(--t2)}
.kgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px}
@media (max-width:820px){.kgrid{grid-template-columns:1fr}.fila .et{width:130px}.fila .num{width:90px}}
input[type=range]{width:80px}
.hide{display:none}
</style>
</head>
<body>
<header>
  <div><h1>Control de Compras y Logística · AgroDávila</h1><div class="sub" id="fuente">—</div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <a class="btn ir-inicio" href="index.html">← Inicio</a><button class="btn p" id="refrescar" type="button">Actualizar</button><button class="btn" id="xlsMatriz" type="button">Excel para la matriz</button><input type="file" id="arch" class="hide" aria-hidden="true" tabindex="-1">
    <button class="btn" id="csv">Descargar pendientes (CSV)</button>
    <button class="btn hide" id="cerrar">Cerrar panel ✕</button>
  </div>
</header>
<nav id="tabs"></nav>
<main id="vista"></main>
<script>
"use strict";
let SNAP = {generado:new Date().toISOString(), filas:[]};
const R = window.AgdReglas;
if (!R) throw new Error("Falta el módulo único de reglas etapas.js");
const U = R.UMBRALES;
const ETAPAS_PRINCIPALES = R.ETAPAS.filter(e => !e.aparte);
const ETAPAS = Object.fromEntries(R.ETAPAS.map(e => [e.id, [e.nombre, e.responsable, e.orden]]));
const ALERTAS = {1:["Pago vencido o no registrado","Crítica",100,"Confirmar con Contabilidad si se pagó; si sí, registrar el pago en AgroControl."],2:["Entrega atrasada del proveedor","Crítica",95,"Llamar al proveedor, pedir nueva fecha y avisar a la finca."],3:["Pagado sin N° de OC","Alta",80,"Registrar la OC oficial."],4:["Pago cercano sin los 3 OK","Alta",70,"Pedir los OK que faltan antes de la fecha."],5:["Cotización demorada","Alta",65,"Cerrar cotizaciones hoy."],6:["Autorización demorada","Alta",60,"Recordar autorización con el comparativo."],7:["Autorizado sin OC","Alta",60,"Generar la OC con lo autorizado."],8:["Pedido sin revisión de campo","Media",45,"Recordar al supervisor de campo."],9:["Menos cotizaciones de las exigidas","Media",40,"Pedir 3 cotizaciones si OC/pedido ≥ $300 o 2 si es menor."],10:["Variación de precio > 10% vs última compra","Media",38,"Revisar diferencia contra la última compra del mismo producto y proveedor."],11:["OC sin programar pago","Media",35,"Pedir fecha de pago a Gerencia."],12:["OC sin número oficial","Media",35,"Registrar el N° de OC."],13:["Línea estancada","Baja",20,"Revisar por qué no avanza."]};
const KR_DEF = {"Fertilizantes":[2,5,5,2,5],"Fungicidas y bactericidas":[3,4,5,4,4],"Insecticidas, acaricidas y molusquicidas":[3,4,5,4,3],"Herbicidas":[2,4,3,4,3],"Bioestimulantes y reguladores de crecimiento":[2,3,3,3,3],"Control biológico":[4,3,4,3,2],"Coadyuvantes y correctores de agua/pH":[1,2,2,2,1],"Abonos orgánicos y sustratos":[2,1,3,1,2],"Riego e hidráulica":[3,4,4,1,3],"Repuestos de maquinaria":[4,4,4,1,2],"Maquinaria y equipos motorizados":[3,4,4,1,3],"Equipos de fumigación y aplicación":[3,4,4,1,2],"Lubricantes, combustibles y fluidos":[1,3,4,2,2],"Material agrícola":[2,2,3,1,2],"EPP y seguridad":[1,2,3,3,1],"AREA SANIDAD":[2,2,3,3,2],"Servicios tecnicos":[3,1,3,1,2],"Herramientas":[1,2,1,1,2],"Ferretería y fijación":[1,1,1,1,1],"Construcción, acabados y plomería":[1,1,1,1,1],"Material eléctrico e iluminación":[1,2,2,1,1],"Desinfección y limpieza":[1,1,2,2,1],"Oficina":[1,1,1,1,1],"Medición Producto/insumo general":[1,1,1,1,1],"Sin clasificar":[1,1,1,1,1]};
const KR_EST = {"Estratégico":["Alianza con 1–2 proveedores, acuerdo anual de precio y volumen, plan de demanda compartido.",20],"Cuello de botella":["Proveedor alterno homologado, stock de seguridad, comprar con anticipación.",20],"Apalancamiento":["3 cotizaciones siempre, compra consolidada entre fincas, negociar volumen y crédito.",10],"No crítico":["Lista de precios fijos, compra mensual consolidada, caja chica.",0]};
const KR_COLOR = {"Estratégico":"#C2591B","Cuello de botella":"#B7791F","Apalancamiento":"#0F4C81","No crítico":"#2E7D4F"};
let KR = (()=>{ try{ return Object.assign({}, KR_DEF, JSON.parse(localStorage.getItem("agd_kraljic")||"{}")); }catch(e){ return {...KR_DEF}; } })();
let FILAS = [], CRUDAS = [], RESUMEN_IND = null, AHORA = new Date(), TAB = (()=>{ try{ return localStorage.getItem("agd_tab")||"pend"; }catch(e){ return "pend"; } })();
const F = {prio:"", finca:"", etapa:"", resp:"", q:""};

const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const num = v => { const n = typeof v==="number"?v:parseFloat(v); return isFinite(n)?n:0; };
const fm = v => "$"+num(v).toLocaleString("es-EC",{minimumFractionDigits:0,maximumFractionDigits:0});
const fm2 = v => "$"+num(v).toLocaleString("es-EC",{minimumFractionDigits:2,maximumFractionDigits:2});
const pct = v => v==null||!isFinite(v)?"—":Math.round(v*100)+"%";
const d1 = v => v==null||!isFinite(v)?"—":v.toFixed(1);
const fecha = v => {
  const ymd = v instanceof Date ? R.fechaLocal(v) : R.fechaLocal(v);
  if (!ymd) return "—";
  const [y,m,d] = ymd.split("-").map(Number);
  return new Date(Date.UTC(y,m-1,d,12)).toLocaleDateString("es-EC",{day:"2-digit",month:"short",timeZone:R.ZONA_HORARIA});
};
function aFecha(v){
  if(v==null||v==="") return null;
  if(v instanceof Date) return isNaN(v)?null:v;
  const ymd = R.fechaLocal(v);
  if (ymd) { const [y,m,d]=ymd.split("-").map(Number); return new Date(Date.UTC(y,m-1,d,12)); }
  return null;
}
const dias = (a,b) => (a&&b)?(b-a)/86400000:null;
const hoy0 = () => aFecha(R.hoyEcuador()) || new Date();
const media = a => a.length?a.reduce((x,y)=>x+y,0)/a.length:null;

function cuadrante(cat, pctGasto){
  const k = KR[cat] || KR_DEF["Sin clasificar"];
  const riesgo = k[0]*.35+k[1]*.2+k[2]*.3+k[3]*.15;
  let fin = k[4];
  if(pctGasto!=null){ const real = pctGasto>=.15?5:pctGasto>=.08?4:pctGasto>=.04?3:pctGasto>=.01?2:1; fin = Math.max(real, k[4]-1); }
  const impacto = fin*.6 + k[2]*.4;
  return {riesgo, impacto, q: impacto>=3?(riesgo>=3?"Estratégico":"Apalancamiento"):(riesgo>=3?"Cuello de botella":"No crítico")};
}

function procesar(crudas){
  const D = ["F. pedido","F. revisión campo","F. 1ª cotización","F. última cotización","F. selección proveedor","F. autorización","F. OC creada","F. pago programada","Pago programado el","F. pago aprobado (3 OK)","F. registro N° OC","F. check final","F. pago realizado","F. entrega","F. anulación"];
  const limpias = (crudas||[]).filter(r=>r&&r["Línea"]);
  const hoyEc = R.fechaLocal(AHORA) || R.hoyEcuador();
  const totRef = R.totalesReferenciaCotizacion(limpias);
  const varPrecios = R.variacionesPrecioHistorico(limpias);
  const haMap = R.hectareasPorFinca(limpias);
  RESUMEN_IND = R.resumirIndicadores(limpias, null, null, hoyEc);
  const H = hoy0();
  const filas = limpias.map(raw=>{
    const x={...raw};
    x["Finca"] = R.normFinca(raw["Finca"]);
    x["Región"] = R.normRegion(raw["Región"], x["Finca"]);
    if (!num(raw["Hectáreas"]) && haMap[x["Finca"]]) x["Hectáreas"] = haMap[x["Finca"]];
    D.forEach(k=>x[k]=aFecha(raw[k]));
    const cot=num(raw["N° cotizaciones"]);
    const et = R.clasificarEtapa(raw);
    x.total = R.montoLinea(raw);
    x.credito = (raw["Tipo de pago"]==="Crédito"||raw["Tipo de pago"]==="Cheque"||num(raw["Días crédito"])>0);
    x.etId = et.id;
    x.n = et.orden;
    x.etapa = et.nombre;
    x.resp = et.responsable;
    x.autorizado = !!et.autorizado;
    x.aparte = !!et.aparte;
    x.abierta = !et.aparte && et.id !== "pagado";
    x.diasEtapa = (x.abierta && et.fecha_inicio) ? Math.max(0, R.diasHabiles(et.fecha_inicio, hoyEc)) : null;
    x.lt = {campo:dias(x["F. pedido"],x["F. revisión campo"]),inicioCot:dias(x["F. revisión campo"],x["F. 1ª cotización"]),cotizando:dias(x["F. 1ª cotización"],x["F. selección proveedor"]),autoriz:dias(x["F. selección proveedor"],x["F. autorización"]),aOC:dias(x["F. autorización"],x["F. OC creada"]),progPago:dias(x["F. OC creada"],x["Pago programado el"]),numOC:dias(x["F. OC creada"],x["F. registro N° OC"]),pedOC:dias(x["F. pedido"],x["F. registro N° OC"]),entrega:dias(x["F. registro N° OC"],x["F. entrega"]),ciclo:dias(x["F. pedido"],x["F. entrega"])};
    const de = raw["Días entrega ofrecidos"]; let est=null;
    if(de!==undefined&&de!==""&&de!==null){ const base = x["F. pago realizado"]||(x.credito&&x["F. registro N° OC"])||x["F. pago programada"]; if(base){ est=new Date(base); est.setDate(est.getDate()+num(de)); } }
    x.entregaEst=est;
    x.aTiempo = x["F. entrega"]&&est ? (R.fechaLocal(x["F. entrega"])<=R.fechaLocal(est)) : null;
    x.reqCot = R.cotizacionesExigidas(raw, totRef);
    const esUnica = R.esCotizacionUnica ? R.esCotizacionUnica(raw) : false;
    x.cotUnica = esUnica;
    x.cotOK = esUnica ? true : ((x.aparte || et.id === "revision_campo") ? null : cot >= x.reqCot);
    x.pendCot = esUnica ? false : R.esPendienteCotizar(raw, totRef);
    x.ahorro = R.ahorroDocumentadoLinea(raw);
    const vp = varPrecios[String(raw["Línea"]||"")] || null;
    x.pctSobre = vp && vp.pct != null ? vp.pct : null;
    x.sobre = vp && vp.diff > 0 ? vp.diff * num(raw["Cantidad"]) : 0;
    const de_ = x.diasEtapa||0, pp=x["F. pago programada"], ppYmd = R.fechaLocal(raw["F. pago programada"]);
    let a=0;
    if(!x.aparte && ppYmd && !raw["F. pago realizado"] && ppYmd < hoyEc) a=1;
    else if(x.abierta && !raw["F. entrega"] && est && hoyEc > R.fechaLocal(est)) a=2;
    else if(!x.aparte && raw["F. pago realizado"] && !raw["N° OC"]) a=3;
    else if(x.abierta && !raw["F. pago aprobado (3 OK)"] && pp && dias(H,pp)<=U.dias_pago_proximo) a=4;
    else if((et.id==="por_cotizar"||et.id==="cotizando") && de_>=U.dias_alerta) a=5;
    else if(et.id==="por_autorizar" && de_>=U.dias_alerta) a=6;
    else if(et.id==="autorizado_sin_oc" && de_>=U.dias_alerta) a=7;
    else if(et.id==="revision_campo" && de_>=U.dias_alerta) a=8;
    else if(x.abierta && x.cotOK===false) a=9;
    else if(!x.aparte && vp && vp.alerta) a=10;
    else if(et.id==="con_oc" && !raw["F. pago programada"] && de_>=U.dias_alerta) a=11;
    else if(!x.aparte && x.autorizado && raw["OC (código)"] && !raw["N° OC"] && de_>=U.dias_alerta) a=12;
    else if(x.abierta && de_>=U.dias_estancado) a=13;
    x.alerta=a;
    return x;
  });
  const tot = filas.filter(r=>!r.aparte).reduce((s,r)=>s+r.total,0), porCat={};
  filas.filter(r=>!r.aparte).forEach(r=>porCat[r["Categoría"]||"Sin clasificar"]=(porCat[r["Categoría"]||"Sin clasificar"]||0)+r.total);
  filas.forEach(r=>{
    const c=r["Categoría"]||"Sin clasificar"; r.kr = cuadrante(c, tot?(porCat[c]||0)/tot:null).q;
    r.puntaje = r.alerta ? ALERTAS[r.alerta][2] + Math.min(r.diasEtapa||0,30)*2 + (r.total>=U.monto_alto?15:0) + (KR_EST[r.kr]?KR_EST[r.kr][1]:5) : 0;
  });
  return filas;
}

function cargar(crudas, origen){ CRUDAS = crudas||[]; FILAS = procesar(CRUDAS); document.getElementById("fuente").textContent = origen; pintar(); }

/* ───── Vistas ───── */
const TABS = [["pend","Pendientes"],["flujo","¿Dónde nos quedamos?"],["kpi","KPIs"],["kraljic","Kraljic"],["prov","Proveedores"],["pagos","Pagos y entregas"]];
function pintarTabs(){ document.getElementById("tabs").innerHTML = TABS.map(([k,l])=>`<button class="${TAB===k?"on":""}" data-t="${k}">${l}${k==="pend"?` (${FILAS.filter(r=>r.alerta).length})`:""}</button>`).join(""); }
document.getElementById("tabs").addEventListener("click",e=>{ const t=e.target.closest("button"); if(!t) return; TAB=t.dataset.t; try{localStorage.setItem("agd_tab",TAB);}catch(x){} pintar(); });

function vPend(){
  const al = FILAS.filter(r=>r.alerta).sort((a,b)=>b.puntaje-a.puntaje);
  const opt = (arr,sel,todo)=>`<option value="">${todo}</option>`+[...new Set(arr)].filter(Boolean).sort().map(v=>`<option ${v===sel?"selected":""}>${esc(v)}</option>`).join("");
  const q=F.q.toLowerCase();
  const lista = al.filter(r=>(!F.prio||ALERTAS[r.alerta][1]===F.prio)&&(!F.finca||r["Finca"]===F.finca)&&(!F.etapa||r.etapa===F.etapa)&&(!F.resp||r.resp===F.resp)&&(!q||(r["Producto"]+" "+r["Línea"]+" "+(r["Proveedor"]||"")).toLowerCase().includes(q)));
  const c = p=>al.filter(r=>ALERTAS[r.alerta][1]===p).length;
  return `<div class="grid" style="margin-bottom:12px">
    ${["Crítica","Alta","Media","Baja"].map(p=>`<div class="card kpi" style="cursor:pointer" data-prio="${p}"><div class="l">${p}</div><div class="v"><span class="chip ${p}" style="font-size:20px">${c(p)}</span></div><div class="m">${p==="Crítica"?"Atender hoy":p==="Alta"?"Atender en 24 h":p==="Media"?"Esta semana":"Revisar"}</div></div>`).join("")}</div>
  <div class="filtros">
    <select data-f="prio">${opt(["Crítica","Alta","Media","Baja"],F.prio,"Toda prioridad")}</select>
    <select data-f="resp">${opt(al.map(r=>r.resp),F.resp,"Todo responsable")}</select>
    <select data-f="etapa">${opt(al.map(r=>r.etapa),F.etapa,"Toda etapa")}</select>
    <select data-f="finca">${opt(al.map(r=>r["Finca"]),F.finca,"Toda finca")}</select>
    <input type="search" data-f="q" placeholder="Buscar producto, línea o proveedor" value="${esc(F.q)}">
  </div>
  <div class="tw"><table><thead><tr><th>#</th><th>Prioridad</th><th>Alerta</th><th>Línea</th><th>Producto</th><th>Finca</th><th>Etapa · responsable</th><th class="n">Días</th><th class="n">Total</th><th>Proveedor</th><th>Qué hacer</th></tr></thead><tbody>
  ${lista.map((r,i)=>`<tr><td>${i+1}</td><td><span class="chip ${ALERTAS[r.alerta][1]}">${ALERTAS[r.alerta][1]}</span></td><td>${esc(ALERTAS[r.alerta][0])}</td><td>${esc(r["Línea"])}</td><td>${esc(r["Producto"])}<div class="nota">${esc(r["Categoría"]||"")} · ${esc(r.kr)}</div></td><td>${esc(r["Finca"])}</td><td>${esc(r.etapa)}<div class="nota">${esc(r.resp)}</div></td><td class="n">${d1(r.diasEtapa)}</td><td class="n">${r.total?fm2(r.total):"—"}</td><td>${esc(r["Proveedor"]||"—")}</td><td class="nota">${esc(ALERTAS[r.alerta][3])}</td></tr>`).join("")||`<tr><td colspan="11">No hay pendientes con estos filtros.</td></tr>`}
  </tbody></table></div><p class="nota">${lista.length} de ${al.length} alertas. Orden: gravedad + días detenido + monto + categoría estratégica.</p>`;
}

function vFlujo(){
  const ab = FILAS.filter(r=>r.abierta);
  const et = ETAPAS_PRINCIPALES.filter(e=>e.id!=="pagado").map(meta=>{ const f=ab.filter(r=>r.etId===meta.id); return {meta,f,acum:f.reduce((s,r)=>s+(r.diasEtapa||0),0),monto:f.reduce((s,r)=>s+r.total,0),max:Math.max(0,...f.map(r=>r.diasEtapa||0))}; });
  const tot = et.reduce((s,x)=>s+x.acum,0)||1, top = et.reduce((a,b)=>b.acum>a.acum?b:a,et[0]);
  const tramos=[["Pedido → revisión de campo","campo",1],["Revisión → 1ª cotización","inicioCot",1],["1ª cotización → selección","cotizando",2],["Selección → autorización","autoriz",1],["Autorización → OC generada","aOC",1],["OC → pago programado","progPago",1],["OC → N° de OC","numOC",1],["Pedido → N° de OC (interno)","pedOC",4],["N° OC → entrega","entrega",3],["Ciclo pedido → entrega","ciclo",10]];
  return `<div class="aviso">Cuello de botella: «${esc(top.f.length?top.meta.nombre:"—")}» concentra ${pct(top.acum/tot)} de todos los días de espera (${top.f.length} líneas, ${d1(top.f.length?top.acum/top.f.length:0)} días hábiles promedio). Responsable: ${esc(top.meta.responsable)}.</div>
  <div class="card"><b>Días hábiles acumulados de espera por etapa</b> <span class="nota">(líneas abiertas)</span>
  ${et.map(x=>`<div class="fila"><div class="et">${x.meta.orden}. ${esc(x.meta.nombre)}</div><div class="barw"><div class="bar" style="width:${(x.acum/tot*100).toFixed(1)}%;${x===top?"background:var(--cr)":""}"></div></div><div class="num">${x.f.length} lín · ${Math.round(x.acum)} d háb. · ${fm(x.monto)}</div></div>`).join("")}</div>
  <div class="sec">Lead time por tramo (fechas reales de AgroControl)</div>
  <div class="tw"><table><thead><tr><th>Tramo</th><th class="n">Medidas</th><th class="n">Promedio (días)</th><th class="n">Máximo</th><th class="n">Meta</th><th>Estado</th></tr></thead><tbody>
  ${tramos.map(([l,k,m])=>{ const v=FILAS.map(r=>r.lt[k]).filter(x=>x!=null&&x>=0); const p=media(v); const s=p==null?"sin datos":p<=m?"ok":p<=m*1.5?"Media":"Crítica";
    return `<tr><td>${l}</td><td class="n">${v.length}</td><td class="n">${d1(p)}</td><td class="n">${v.length?d1(Math.max(...v)):"—"}</td><td class="n">${m}</td><td><span class="chip ${s}">${s==="ok"?"Cumple":s==="Media"?"Cerca":s==="Crítica"?"No cumple":"Sin datos"}</span></td></tr>`; }).join("")}
  </tbody></table></div><p class="nota">Sin fechas de pago ni de entrega registradas en la app, los tramos finales no se pueden medir. Eso es lo primero que hay que corregir.</p>`;
}

function vKpi(){
  const ab=FILAS.filter(r=>r.abierta), ind=RESUMEN_IND||R.resumirIndicadores(CRUDAS), T=ind.tarjetas;
  const cxp = ind.cuentas_por_pagar || { tramos: [] };
  const cultivos = ind.gasto_por_cultivo || [];
  const k=[
   ["Gasto comprometido + ejecutado",fm(T.gasto_comprometido_ejecutado),"autorizado en adelante (sin anulados/rechazados)"],
   ["Con OC $",fm(T.con_oc_monto),"en proceso de entrega"],
   ["Recibido $",fm(T.recibido_monto),"entregado en finca (recibido + pagado)"],
   ["Sin ninguna cotización", T.sin_cotizar != null ? T.sin_cotizar : 0, "aprobado campo sin proforma registrada"],
   ["Falta completar cotizaciones", T.falta_completar_cotizaciones != null ? T.falta_completar_cotizaciones : 0, "tienen 1 de 2 / 2 de 3"],
   ["Pagos por confirmar",fm(T.pagos_por_confirmar),(T.pagos_por_confirmar_ocs||0)+" OCs vencidas · meta 0"],
   ["OC abiertas",ind.ocs_abiertas.cantidad,"meta control activo"],
   ["Pedido → N° OC",d1(ind.dias_pedido_a_oc.promedio)+" d","meta "+ind.dias_pedido_a_oc.meta+" días"],
   ["Cumplimiento de entrega",pct(ind.cumplimiento_entrega.pct_a_tiempo),ind.cumplimiento_entrega.entregadas+" con entrega · meta 90%"],
   ["% gasto USD cotiz. suficientes",pct(ind.pct_gasto_cotizaciones_suficientes.pct),"≥3 si OC/ped ≥ "+fm(U.monto_tres_cotizaciones)+" · ≥2 si menor"],
   ["Ahorro documentado",fm(ind.ahorro_documentado),"(prom. cotiz − precio elegido) × cant. autoriz."],
   ["Variaciones de precio > 10%",ind.alertas_variacion_precio,"vs última compra mismo producto y prov."],
   ["Líneas abiertas / estancadas",ab.length+" / "+ab.filter(r=>(r.diasEtapa||0)>=U.dias_estancado).length,"estancadas ≥ "+U.dias_estancado+" d háb."]];
  return `<div class="grid">${k.map(([l,v,m])=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="m">${m}</div></div>`).join("")}</div>
  <div class="sec">Por finca y costo por hectárea (6 fincas oficiales)</div><div class="tw"><table><thead><tr><th>Finca</th><th>Zona</th><th class="n">Ha</th><th class="n">Gasto comprometido</th><th class="n">$ por ha</th><th class="n">Abiertas</th><th class="n">Críticas</th><th class="n">Pedido → OC</th></tr></thead><tbody>
  ${R.FINCAS.map(fm_=>{ const fn=fm_.nombre, x=FILAS.filter(r=>r["Finca"]===fn), gf=(ind.gasto_por_finca[fn]||{monto:0}).monto, ha=(ind.hectareas_finca&&ind.hectareas_finca[fn])||fm_.hectareas_base, cph=ind.costo_por_hectarea&&ind.costo_por_hectarea[fn];
    return `<tr><td>${esc(fn)}</td><td>${esc(fm_.zona)}</td><td class="n">${ha}</td><td class="n">${fm(gf)}</td><td class="n">${cph!=null?fm2(cph):"—"}</td><td class="n">${x.filter(r=>r.abierta).length}</td><td class="n">${x.filter(r=>r.alerta&&ALERTAS[r.alerta][1]==="Crítica").length}</td><td class="n">${d1(media(x.map(r=>r.lt.pedOC).filter(v=>v!=null)))}</td></tr>`; }).join("")}
  </tbody></table></div>
  <div class="kgrid" style="margin-top:14px">
    <div class="tw"><table><thead><tr><th colspan="3">Gasto por cultivo</th></tr><tr><th>Cultivo</th><th class="n">Líneas</th><th class="n">Gasto $</th></tr></thead><tbody>
    ${cultivos.map(c=>`<tr><td>${esc(c.cultivo)}</td><td class="n">${c.lineas}</td><td class="n">${fm2(c.monto)}</td></tr>`).join("")||'<tr><td colspan="3">Sin datos</td></tr>'}
    </tbody></table></div>
    <div class="tw"><table><thead><tr><th colspan="3">Cuentas por pagar por vencimiento (OCs)</th></tr><tr><th>Tramo</th><th class="n">OCs</th><th class="n">Monto $</th></tr></thead><tbody>
    ${cxp.tramos.map(t=>`<tr><td>${esc(t.tramo)}</td><td class="n">${t.ocs}</td><td class="n">${fm2(t.monto)}</td></tr>`).join("")||'<tr><td colspan="3">Sin OCs pendientes</td></tr>'}
    </tbody></table></div>
  </div>`;
}

function vKraljic(){
  const act=FILAS.filter(r=>!r.aparte), tot=act.reduce((s,r)=>s+r.total,0);
  const cats=[...new Set([...Object.keys(KR),...act.map(r=>r["Categoría"]||"Sin clasificar")])];
  const datos=cats.map(c=>{ const f=act.filter(r=>(r["Categoría"]||"Sin clasificar")===c), g=f.reduce((s,r)=>s+r.total,0); return {c,g,lin:f.length,prov:new Set(f.map(r=>r["Proveedor"]).filter(Boolean)).size,...cuadrante(c,tot?g/tot:null)}; }).sort((a,b)=>b.g-a.g);
  const W=460,Hh=360,P=36, x=v=>P+(v-1)/4*(W-2*P), y=v=>Hh-P-(v-1)/4*(Hh-2*P), maxg=Math.max(1,...datos.map(d=>d.g));
  const svg=`<svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="Matriz de Kraljic">
    <rect x="${x(3)}" y="${y(5)}" width="${x(5)-x(3)}" height="${y(3)-y(5)}" fill="${KR_COLOR["Estratégico"]}" opacity=".08"/><rect x="${x(1)}" y="${y(5)}" width="${x(3)-x(1)}" height="${y(3)-y(5)}" fill="${KR_COLOR["Apalancamiento"]}" opacity=".08"/>
    <rect x="${x(3)}" y="${y(3)}" width="${x(5)-x(3)}" height="${y(1)-y(3)}" fill="${KR_COLOR["Cuello de botella"]}" opacity=".08"/><rect x="${x(1)}" y="${y(3)}" width="${x(3)-x(1)}" height="${y(1)-y(3)}" fill="${KR_COLOR["No crítico"]}" opacity=".08"/>
    <line x1="${x(3)}" x2="${x(3)}" y1="${y(5)}" y2="${y(1)}" stroke="currentColor" opacity=".25"/><line x1="${x(1)}" x2="${x(5)}" y1="${y(3)}" y2="${y(3)}" stroke="currentColor" opacity=".25"/>
    <text x="${x(4)}" y="${y(4.85)}" text-anchor="middle" font-size="11" font-weight="700" fill="${KR_COLOR["Estratégico"]}">ESTRATÉGICO</text><text x="${x(2)}" y="${y(4.85)}" text-anchor="middle" font-size="11" font-weight="700" fill="${KR_COLOR["Apalancamiento"]}">APALANCAMIENTO</text>
    <text x="${x(4)}" y="${y(1.12)}" text-anchor="middle" font-size="11" font-weight="700" fill="${KR_COLOR["Cuello de botella"]}">CUELLO DE BOTELLA</text><text x="${x(2)}" y="${y(1.12)}" text-anchor="middle" font-size="11" font-weight="700" fill="${KR_COLOR["No crítico"]}">NO CRÍTICO</text>
    <text x="${W/2}" y="${Hh-6}" text-anchor="middle" font-size="11" fill="currentColor" opacity=".7">Riesgo de suministro →</text><text x="12" y="${Hh/2}" transform="rotate(-90 12 ${Hh/2})" text-anchor="middle" font-size="11" fill="currentColor" opacity=".7">Impacto en el resultado →</text>
    ${datos.filter(d=>d.g>0).map(d=>`<circle cx="${x(d.riesgo)}" cy="${y(d.impacto)}" r="${5+Math.sqrt(d.g/maxg)*18}" fill="${KR_COLOR[d.q]}" opacity=".55"><title>${esc(d.c)}: ${fm(d.g)} · riesgo ${d.riesgo.toFixed(1)} · impacto ${d.impacto.toFixed(1)}</title></circle>`).join("")}
    ${(()=>{ const usados={}; return datos.filter(d=>d.g>0).slice(0,10).map(d=>{ const k=d.riesgo.toFixed(1)+"|"+d.impacto.toFixed(1); const n=usados[k]=(usados[k]||0)+1; return `<text x="${x(d.riesgo)+10}" y="${y(d.impacto)-4+(n-1)*12}" font-size="10" fill="currentColor">${esc(d.c.split(/[ ,]/)[0])}</text>`; }).join(""); })()}
  </svg>`;
  const sl=(c,i)=>`<input type="range" min="1" max="5" step="1" value="${(KR[c]||KR_DEF["Sin clasificar"])[i]}" data-c="${esc(c)}" data-i="${i}" aria-label="${["Escasez","Importado/volátil","Criticidad","Regulación","Impacto estimado"][i]} ${esc(c)}">`;
  return `<div class="kgrid"><div class="card">${svg}<p class="nota">Tamaño del círculo = gasto. Pase el mouse para ver el detalle.</p></div>
  <div class="card">${Object.keys(KR_EST).map(q=>{ const ds=datos.filter(d=>d.q===q); return `<div style="margin-bottom:12px"><span class="chip" style="background:${KR_COLOR[q]}22;color:${KR_COLOR[q]}">${q}</span> <b>${ds.length} categorías · ${fm(ds.reduce((s,d)=>s+d.g,0))}</b><div class="nota">${KR_EST[q][0]}</div></div>`; }).join("")}</div></div>
  <div class="sec">Ajustar riesgo (1 = bajo, 5 = alto). Se guarda en este navegador.</div>
  <div class="tw"><table><thead><tr><th>Categoría</th><th class="n">Gasto</th><th class="n">Prov.</th><th>Escasez</th><th>Importado / volátil</th><th>Criticidad cultivo</th><th>Regulación</th><th>Impacto estimado</th><th>Cuadrante</th></tr></thead><tbody>
  ${datos.map(d=>`<tr><td>${esc(d.c)}</td><td class="n">${fm(d.g)}</td><td class="n">${d.prov}</td>${[0,1,2,3,4].map(i=>`<td>${sl(d.c,i)}</td>`).join("")}<td><span class="chip" style="background:${KR_COLOR[d.q]}22;color:${KR_COLOR[d.q]}">${d.q}</span></td></tr>`).join("")}
  </tbody></table></div>`;
}

function vProv(){
  const act=FILAS.filter(r=>!r.aparte&&r["Proveedor"]), tot=act.reduce((s,r)=>s+r.total,0);
  const pv=[...new Set(act.map(r=>r["Proveedor"]))].map(p=>{ const f=act.filter(r=>r["Proveedor"]===p), e=f.filter(r=>r.aTiempo!=null);
    return {p,g:f.reduce((s,r)=>s+r.total,0),lin:f.length,cats:new Set(f.map(r=>r["Categoría"])).size,tp:[...new Set(f.map(r=>r["Tipo de pago"]).filter(Boolean))].join(", "),cred:Math.max(0,...f.map(r=>num(r["Días crédito"]))),ofrec:media(f.map(r=>r["Días entrega ofrecidos"]).filter(v=>v!==undefined&&v!=="").map(num)),otd:e.length?e.filter(r=>r.aTiempo).length/e.length:null,atr:f.filter(r=>r.alerta===2).length,ah:f.reduce((s,r)=>s+r.ahorro,0)}; }).sort((a,b)=>b.g-a.g);
  let acum=0;
  return `<div class="tw"><table><thead><tr><th>Proveedor</th><th class="n">Gasto</th><th class="n">% acum.</th><th class="n">Líneas</th><th>Pago</th><th class="n">Crédito</th><th class="n">Entrega ofrecida (d)</th><th class="n">A tiempo</th><th class="n">Atrasos</th><th class="n">Ahorro logrado</th><th>Calificación</th></tr></thead><tbody>
  ${pv.map(x=>{ acum+=x.g; const cal=x.otd==null?["Sin entregas registradas","Media"]:x.otd>=.9&&!x.atr?["A · Preferente","ok"]:x.otd>=.75?["B · Aceptable","Media"]:["C · Plan de mejora","Crítica"];
    return `<tr><td>${esc(x.p)}</td><td class="n">${fm(x.g)}</td><td class="n">${pct(acum/(tot||1))}</td><td class="n">${x.lin}</td><td>${esc(x.tp)}</td><td class="n">${x.cred||"—"}</td><td class="n">${d1(x.ofrec)}</td><td class="n">${pct(x.otd)}</td><td class="n">${x.atr||"—"}</td><td class="n">${fm(x.ah)}</td><td><span class="chip ${cal[1]}">${cal[0]}</span></td></tr>`; }).join("")}
  </tbody></table></div><p class="nota">«% acum.» sirve de Pareto: los proveedores hasta el 80% son los que hay que negociar primero.</p>`;
}

function vPagos(){
  const H=hoy0(), oc={};
  FILAS.filter(r=>r["OC (código)"]&&r.abierta).forEach(r=>{ const k=r["OC (código)"]; (oc[k]=oc[k]||{k,prov:r["Proveedor"],finca:r["Finca"],tp:r["Tipo de pago"],pp:r["F. pago programada"],nOC:r["N° OC"],est:r.entregaEst,ent:r["F. entrega"],pag:r["F. pago realizado"],tot:0,lin:0}); oc[k].tot+=r.total; oc[k].lin++; });
  const L=Object.values(oc).sort((a,b)=>(a.pp||0)-(b.pp||0));
  const est=o=>{ if(o.pag) return o.ent?["Cerrada","ok"]:["Pagada, falta entrega","Media"]; if(o.pp&&o.pp<H) return ["Pago vencido / sin registrar","Crítica"]; if(o.pp&&dias(H,o.pp)<=7) return ["Pagar esta semana","Alta"]; return ["Programado","ok"]; };
  const ent=o=>o.ent?["Entregada","ok"]:(o.est&&H>o.est)?["Entrega atrasada","Crítica"]:o.est?["Esperada "+fecha(o.est),"Media"]:["Sin fecha","Baja"];
  return `<div class="tw"><table><thead><tr><th>OC</th><th>N° OC</th><th>Proveedor</th><th>Finca</th><th>Pago</th><th>F. pago</th><th class="n">Monto</th><th>Estado del pago</th><th>Entrega</th></tr></thead><tbody>
  ${L.map(o=>{ const a=est(o), b=ent(o); return `<tr><td>${esc(o.k)}</td><td>${esc(o.nOC||"—")}</td><td>${esc(o.prov||"—")}</td><td>${esc(o.finca)}</td><td>${esc(o.tp||"—")}</td><td>${fecha(o.pp)}</td><td class="n">${fm2(o.tot)}</td><td><span class="chip ${a[1]}">${a[0]}</span></td><td><span class="chip ${b[1]}">${b[0]}</span></td></tr>`; }).join("")}
  </tbody></table></div><p class="nota">Una OC por fila (agrupa sus productos). «Sin registrar» = la fecha ya pasó y la app no tiene la fecha de pago real.</p>`;
}

function pintar(){
  pintarTabs();
  const v=document.getElementById("vista");
  v.innerHTML = !FILAS.length ? `<div class="card">Cargue el Excel del exportador de AgroControl.</div>` : ({pend:vPend,flujo:vFlujo,kpi:vKpi,kraljic:vKraljic,prov:vProv,pagos:vPagos}[TAB]||vPend)();
}
document.getElementById("vista").addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.f){ F[t.dataset.f]=t.value; pintar(); }
  if(t.type==="range"){ const c=t.dataset.c; KR[c]=[...(KR[c]||KR_DEF["Sin clasificar"])]; KR[c][+t.dataset.i]=+t.value; try{localStorage.setItem("agd_kraljic",JSON.stringify(KR));}catch(x){} if(window.AgdNube)AgdNube.guardarAjustes({kraljic:KR}); FILAS=procesar(FILAS.map(r=>r)); pintar(); }
});
document.getElementById("vista").addEventListener("input",e=>{ if(e.target.dataset.f==="q"){ F.q=e.target.value; const pos=e.target.selectionStart; pintar(); const s=document.querySelector('[data-f="q"]'); if(s){ s.focus(); s.setSelectionRange(pos,pos);} } });
document.getElementById("vista").addEventListener("click",e=>{ const c=e.target.closest("[data-prio]"); if(c){ F.prio=F.prio===c.dataset.prio?"":c.dataset.prio; pintar(); } });
document.getElementById("arch").addEventListener("change",async e=>{
  const f=e.target.files[0]; if(!f) return;
  if(typeof XLSX==="undefined"){ alert("Sin internet no se puede leer el Excel (se necesita la librería SheetJS)."); return; }
  const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true}); const ws=wb.Sheets[wb.SheetNames[0]];
  const filas=XLSX.utils.sheet_to_json(ws,{defval:"",raw:true});
  if(!filas.length||!("F. pedido" in filas[0])){ alert("Este archivo no es del exportador de AgroControl (falta la columna «F. pedido»)."); return; }
  AHORA=new Date(); cargar(filas, `Archivo: ${f.name} · calculado el ${AHORA.toLocaleString("es-EC")}`);
});
document.getElementById("csv").addEventListener("click",()=>{
  const al=FILAS.filter(r=>r.alerta).sort((a,b)=>b.puntaje-a.puntaje);
  const cab=["Prioridad","Alerta","Línea","Producto","Finca","Etapa","Responsable","Días en etapa","Total","Proveedor","Acción"];
  const q=v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const txt="﻿"+[cab.join(";")].concat(al.map(r=>[ALERTAS[r.alerta][1],ALERTAS[r.alerta][0],r["Línea"],r["Producto"],r["Finca"],r.etapa,r.resp,d1(r.diasEtapa),r.total.toFixed(2),r["Proveedor"]||"",ALERTAS[r.alerta][3]].map(q).join(";"))).join("\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([txt],{type:"text/csv"})); a.download="pendientes_compras.csv"; a.click();
});
let ULTIMA=0, CARGANDO=false;
async function cargarVivo(silencioso, forzar){
  if(CARGANDO) return; CARGANDO=true;
  const f=document.getElementById("fuente"); if(!silencioso) f.textContent="Leyendo AgroControl…";
  try{ const ses=await ComprasApp.exigirSesion({permitirNube:true}); const r=await ComprasApp.filasAgro({forzar:!!forzar}); const s={filas:r.filas||[], usuario:(ses&&ses.email)||r.origen||"nube", generado:r.actualizado_en||new Date().toISOString()}; SNAP=s; AHORA=new Date(); ULTIMA=Date.now();
       const pos=window.scrollY; cargar(s.filas, `EN VIVO · ${s.usuario} · actualizado ${AHORA.toLocaleTimeString("es-EC",{hour:"2-digit",minute:"2-digit"})} · se actualiza solo cada 5 min`); if(silencioso) window.scrollTo(0,pos); }
  catch(e){ if(e.message!=="sin sesión"){ if(silencioso) f.textContent="Sin conexión: mostrando la última lectura ("+new Date(ULTIMA).toLocaleTimeString("es-EC",{hour:"2-digit",minute:"2-digit"})+")";
            else document.getElementById("vista").innerHTML=`<div class="card">No se pudo leer AgroControl: ${esc(e.message)}. Revise su conexión; se reintentará solo.</div>`; } }
  CARGANDO=false;
}
document.getElementById("refrescar").onclick=()=>cargarVivo(false, true);
document.getElementById("xlsMatriz").onclick=()=>{ try{ if(!SNAP.filas.length) throw new Error("Todavía no hay datos."); ComprasApp.excelMatriz(SNAP.filas); toast_("Excel descargado: péguelo en Datos_AgroControl!A4 del Modelo de Gestión"); }catch(e){ alert(e.message); } };
function toast_(t){ const f=document.getElementById("fuente"), a=f.textContent; f.textContent=t; setTimeout(()=>{ if(f.textContent===t) f.textContent=a; },5000); }
setInterval(()=>{ if(document.visibilityState==="visible") cargarVivo(true, false); }, 5*60*1000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && Date.now()-ULTIMA>2*60*1000) cargarVivo(true, false); });
window.addEventListener("online",()=>cargarVivo(true, false));
if(window.AgdNube)AgdNube.alCambiarEstado(est=>{if(est&&est.conectado)AgdNube.sincronizarAjustes(d=>{if(d&&d.kraljic){KR=Object.assign({},KR_DEF,d.kraljic);if(TAB==="kraljic")pintar();}});});
cargarVivo(false, false);
</script>
